name: tushare
display_name: "Tushare（除权/分钟/财务/盘后特色数据）"
runtime: none
entry: app.plugins.tushare.provider:TushareProvider
check: app.plugins.tushare.provider:availability
datasets: [adj_factor, minute, financial]
api_key_env: TUSHARE_TOKEN
description: "使用标准接口提供 A 股除权因子与财务分析，stk_mins 提供历史分钟 K；盘后还可增量同步开盘/收盘集合竞价与沪深董秘问答。日K与实时行情仍由其他数据源提供。"
install_hint: "在卡片中配置 Tushare Token；分钟、集合竞价、董秘问答均需对应独立权限，财务标准接口需至少 2000 积分。"
